name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        WOOCOMMERCE_VERSION: [latest-stable, 10.0.2]
        ACORN_VERSION: ['^6.0', '^5.0']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          composer require roots/acorn:"${{ matrix.ACORN_VERSION }}" --no-update
          composer install --prefer-dist --no-progress --no-interaction
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Lint
        run: composer test

      - name: Pin WooCommerce
        run: |
          cat > .wp-env.override.json <<EOF
          {"plugins": ["https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.WOOCOMMERCE_VERSION }}.zip", "https://downloads.wordpress.org/plugin/redis-cache.latest-stable.zip"]}
          EOF

      - name: Start wp-env
        run: npx @wordpress/env@latest start

      - name: Integration tests
        run: composer test:integration

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
